name: Generate GitHub Snake

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'
  schedule:
    # Actualiza la animación todos los días (UTC)
    - cron: '17 6 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar la animación desde el gráfico de contribuciones
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: yamix-rx
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2322c55e&color_dots=%23101815,%230e4429,%23006d32,%2326a641,%2339d353
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%234ade80

      - name: Publicar SVG animados en la rama output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
